<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exchange Rate Calculator</title>
    <link href="css/style.css" rel="stylesheet" />
</head>
<body>
    <main class="calculator">
        <img src="img/money.png" class="money-img" alt="" />
        <h1>Exchange Rate Calculator</h1>
        <p>Choose currencies and enter an amount to see the latest exchange rate.</p>

        <div class="currency">
            <label for="currency-one">From</label>
            <select id="currency-one" aria-label="Source currency">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="JPY">JPY</option>
                <option value="MMK">MMK</option>
            </select>
            <input type="number" id="amount-one" min="0" step="any" inputmode="decimal" value="1" aria-label="Source amount" />
        </div>

        <div class="swap-rate-container">
            <button id="swap" class="btn" type="button" aria-label="Swap currencies">Swap</button>
            <div id="rate" class="rate" aria-live="polite">Loading current rate…</div>
        </div>

        <div class="currency">
            <label for="currency-two">To</label>
            <select id="currency-two" aria-label="Target currency">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="JPY">JPY</option>
                <option value="MMK">MMK</option>
            </select>
            <input type="number" id="amount-two" min="0" step="any" inputmode="decimal" value="" aria-label="Converted amount" />
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p class="attribution"><a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">Rates by Exchange Rate API</a></p>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
